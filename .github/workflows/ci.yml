name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: PYTHONPATH=src python -m compileall -q src orchestration scripts tests

      - name: Run tests
        run: PYTHONPATH=src pytest -q

      - name: Build Docker image
        run: docker build -t dw-financeiro-comercial-pipeline:ci .

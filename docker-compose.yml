name: dw-financeiro-comercial

services:

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: dwfc-prefect-server

    command:
      prefect server start --host 0.0.0.0

    ports:
      - "4200:4200"

    volumes:
      - prefect_data:/root/.prefect

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dwfc-pipeline

    env_file:
      - .env

    environment:
      PYTHONPATH: /app/src

      PREFECT_API_URL: http://prefect-server:4200/api

      SOURCE_DB_HOST: host.docker.internal
      SOURCE_DB_PORT: "5432"

      DW_DB_HOST: host.docker.internal
      DW_DB_PORT: "5432"

    depends_on:
      prefect-server:
        condition: service_healthy

    command:
      python orchestration/prefect_flow.py

    restart: unless-stopped


volumes:
  prefect_data: